name: Host tools and document checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q tools tests
      - name: Synthetic audit tests
        run: python3 -m unittest discover -s tests -v
      - name: Metadata JSON
        run: python3 -m json.tool docs/BUILD-ARTIFACTS-2026-11-03.json >/dev/null
      - name: Missing docs and suspicious public files
        run: |
          set -eu
          test -s README.md
          test -s docs/STATUS.md
          test -s security/XCPE-VIDEOSTRONG.md
          if find . -type f \( -name '*.img' -o -name '*.pem' -o -name '*.key' -o -name '*.pcap' \) | grep -q .; then
             echo "Unexpected binary/device/private artifact" >&2
             exit 1
          fi
